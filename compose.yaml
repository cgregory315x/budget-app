services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_app}
      POSTGRES_USER: ${POSTGRES_USER:-budget_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_app}
    ports:
      - "5432:5432"
    volumes:
      - budget_app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_app_postgres:

